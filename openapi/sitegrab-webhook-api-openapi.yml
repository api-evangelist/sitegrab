openapi: 3.2.0
info:
  title: Sitegrab Webhook API
  version: 1.0.0
  contact:
    url: https://sitegrab.dev/contact
  description: 'Operations tagged Webhook across 2 of this provider''s published API definitions: sitegrab-openapi.json, sitegrab-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sitegrab.dev
  description: Production API server
- url: https://sitegrab.dev
  description: Website
tags:
- name: Webhook
paths:
  /v1/webhook:
    post:
      summary: Stripe webhook endpoint
      description: Receives Stripe payment events to upgrade API keys on successful payment.
      operationId: stripeWebhook
      parameters:
      - name: Stripe-Signature
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid signature
      tags:
      - Webhook
    servers:
    - url: https://api.sitegrab.dev
      description: Production API server
    - url: https://sitegrab.dev
      description: Website
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your SiteGrab API key
    ApiKeyParam:
      type: apiKey
      in: query
      name: key
      description: API key as query parameter (alternative to header)
externalDocs:
  description: Full documentation with code examples
  url: https://sitegrab.dev/docs
x-refined-from:
- sitegrab-openapi.json
- sitegrab-openapi.json
