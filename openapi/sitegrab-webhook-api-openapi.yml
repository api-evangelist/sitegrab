openapi: 3.2.0
info:
  title: SiteGrab Screenshot Webhook API
  description: 'Capture pixel-perfect screenshots of any webpage via a simple REST API. Supports JPEG, PNG, full-page capture modes with custom viewport sizes. Free tier: 50 screenshots/month.'
  version: 1.0.0
  contact:
    url: https://sitegrab.dev/contact
servers:
- url: https://api.sitegrab.dev
  description: Production API server
- url: https://sitegrab.dev
  description: Website
tags:
- name: Webhook
paths:
  /v1/webhook:
    post:
      summary: Stripe webhook endpoint
      description: Receives Stripe payment events to upgrade API keys on successful payment.
      operationId: stripeWebhook
      parameters:
      - name: Stripe-Signature
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid signature
      tags:
      - Webhook
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your SiteGrab API key
    ApiKeyParam:
      type: apiKey
      in: query
      name: key
      description: API key as query parameter (alternative to header)
externalDocs:
  description: Full documentation with code examples
  url: https://sitegrab.dev/docs
