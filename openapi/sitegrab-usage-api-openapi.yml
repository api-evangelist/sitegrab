openapi: 3.2.0
info:
  title: Sitegrab Usage API
  version: 1.0.0
  contact:
    url: https://sitegrab.dev/contact
  description: 'Operations tagged Usage across 2 of this provider''s published API definitions: sitegrab-openapi.json, sitegrab-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sitegrab.dev
  description: Production API server
- url: https://sitegrab.dev
  description: Website
tags:
- name: Usage
paths:
  /v1/usage:
    get:
      summary: Get usage stats
      description: Returns the current month's screenshot count and rate limit status for a given API key.
      operationId: getUsage
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: Usage statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  limit:
                    type: integer
                  remaining:
                    type: integer
        '401':
          description: Missing API key
      tags:
      - Usage
    servers:
    - url: https://api.sitegrab.dev
      description: Production API server
    - url: https://sitegrab.dev
      description: Website
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your SiteGrab API key
    ApiKeyParam:
      type: apiKey
      in: query
      name: key
      description: API key as query parameter (alternative to header)
externalDocs:
  description: Full documentation with code examples
  url: https://sitegrab.dev/docs
x-refined-from:
- sitegrab-openapi.json
- sitegrab-openapi.json
