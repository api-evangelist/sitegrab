openapi: 3.2.0
info:
  title: Sitegrab Health API
  version: 1.0.0
  contact:
    url: https://sitegrab.dev/contact
  description: 'Operations tagged Health across 2 of this provider''s published API definitions: sitegrab-openapi.json, sitegrab-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sitegrab.dev
  description: Production API server
- url: https://sitegrab.dev
  description: Website
tags:
- name: Health
paths:
  /v1/health:
    get:
      summary: Health check
      description: Returns API health status and version information.
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  version:
                    type: string
      tags:
      - Health
    servers:
    - url: https://api.sitegrab.dev
      description: Production API server
    - url: https://sitegrab.dev
      description: Website
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your SiteGrab API key
    ApiKeyParam:
      type: apiKey
      in: query
      name: key
      description: API key as query parameter (alternative to header)
externalDocs:
  description: Full documentation with code examples
  url: https://sitegrab.dev/docs
x-refined-from:
- sitegrab-openapi.json
- sitegrab-openapi.json
