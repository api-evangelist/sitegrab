openapi: 3.2.0
info:
  title: SiteGrab Screenshot Checkout API
  description: 'Capture pixel-perfect screenshots of any webpage via a simple REST API. Supports JPEG, PNG, full-page capture modes with custom viewport sizes. Free tier: 50 screenshots/month.'
  version: 1.0.0
  contact:
    url: https://sitegrab.dev/contact
servers:
- url: https://api.sitegrab.dev
  description: Production API server
- url: https://sitegrab.dev
  description: Website
tags:
- name: Checkout
paths:
  /v1/checkout:
    post:
      summary: Create Stripe checkout session
      description: Creates a Stripe Checkout Session for upgrading to a paid tier.
      operationId: createCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tier
              - api_key
              properties:
                tier:
                  type: string
                  enum:
                  - starter
                  - pro
                  - business
                  description: Target tier
                api_key:
                  type: string
                  description: Existing API key to upgrade
      responses:
        '200':
          description: Checkout URL created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
      tags:
      - Checkout
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your SiteGrab API key
    ApiKeyParam:
      type: apiKey
      in: query
      name: key
      description: API key as query parameter (alternative to header)
externalDocs:
  description: Full documentation with code examples
  url: https://sitegrab.dev/docs
