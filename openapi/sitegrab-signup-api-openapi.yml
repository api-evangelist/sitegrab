openapi: 3.2.0
info:
  title: Sitegrab Signup API
  version: 1.0.0
  contact:
    url: https://sitegrab.dev/contact
  description: 'Operations tagged Signup across 2 of this provider''s published API definitions: sitegrab-openapi.json, sitegrab-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sitegrab.dev
  description: Production API server
- url: https://sitegrab.dev
  description: Website
tags:
- name: Signup
paths:
  /signup:
    get:
      summary: Sign up page
      description: HTML sign-up page with Google OAuth login and direct key generation.
      operationId: getSignup
      responses:
        '200':
          description: HTML signup page
          content:
            text/html: {}
      tags:
      - Signup
    servers:
    - url: https://api.sitegrab.dev
      description: Production API server
    - url: https://sitegrab.dev
      description: Website
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your SiteGrab API key
    ApiKeyParam:
      type: apiKey
      in: query
      name: key
      description: API key as query parameter (alternative to header)
externalDocs:
  description: Full documentation with code examples
  url: https://sitegrab.dev/docs
x-refined-from:
- sitegrab-openapi.json
- sitegrab-openapi.json
